app:
  dev-user-id: 1

spring:
  ai:
    model:
      chat: ${SPRING_AI_MODEL_CHAT:none}
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    out-of-order: true
    locations: classpath:db/migration,classpath:db/migration/dev

logging:
  level:
    com.expenseassistant.assistant.tools: DEBUG