<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat history – AI Expense Assistant</title><style>:root{--ink:#0e1b2c;--bg:#f3f5f8;--card:#fff;--accent:#0f766e;--accent-soft:#e3f3f1;--warn:#b45309;--warn-soft:#fef3c7;--danger:#b42318;--mut:#5b6b7f;--line:#e2e6ec;--r:10px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
a{color:var(--accent);text-decoration:none}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:8px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:#0b5f58}.btn:hover{background:#f7f9fb}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#cfd8e3;padding:22px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:700;font-size:17px;padding:0 8px 18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800}
.side a{color:#cfd8e3;padding:10px 12px;border-radius:8px;display:flex;gap:10px;align-items:center}
.side a.on,.side a:hover{background:#1a2c44;color:#fff}
.side .me{margin-top:auto;padding:10px 12px;font-size:13px;color:#93a3b8}
.main{padding:26px 30px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mut);margin:2px 0 0}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.4fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat .k{color:var(--mut);font-size:13px}.stat .v{font-size:27px;font-weight:700;margin:4px 0}
.up{color:var(--danger)}.down{color:var(--accent)}.small{font-size:13px;color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;background:#f0f3f7;font-size:12.5px;font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse}
th{text-align:left;color:var(--mut);font-weight:600;font-size:13px;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:11px 6px;border-bottom:1px solid var(--line)}td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.donutwrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;position:relative;flex:none;background:conic-gradient(#ef4444 0 32.5%,#f59e0b 32.5% 58%,#ec4899 58% 74.1%,#3b82f6 74.1% 84.3%,#8b5cf6 84.3% 90.6%,#10b981 90.6% 95.3%,#f97316 95.3% 98.4%,#06b6d4 98.4% 100%)}
.donut:after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.legend{display:grid;gap:6px;font-size:13.5px;flex:1;min-width:150px}
.legend div{display:flex;justify-content:space-between;gap:10px}
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bar i{display:block;width:100%;max-width:44px;background:#b6dcd8;border-radius:6px 6px 0 0}
.bar.cur i{background:var(--accent)}.bar span{font-size:12px;color:var(--mut)}
.field{display:grid;gap:5px;margin-bottom:14px}.field label{font-weight:600;font-size:14px}
.field input{padding:11px 12px;border:1px solid #cbd3dd;border-radius:8px;font:inherit;width:100%}
.err{color:var(--danger);font-size:13px;min-height:16px}
@media(max-width:960px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px}.brand{padding:0 10px 0 0}.side .me{display:none}.main{padding:18px 14px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tools select,.tools input,.field select,.field textarea{padding:9px 10px;border:1px solid #cbd3dd;border-radius:8px;font:inherit;background:#fff;width:auto}
.field select,.field textarea{width:100%}.field textarea{resize:vertical;min-height:64px}
.field input.bad,.field select.bad{border-color:var(--danger)}
.ib{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 9px;font-size:13px}.ib.d{color:var(--danger)}
.ov{position:fixed;inset:0;background:rgba(14,27,44,.5);display:none;place-items:center;padding:16px;z-index:20}
.ov.open{display:grid}
.modal{background:#fff;border-radius:14px;padding:22px;width:100%;max-width:440px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{font-size:19px;margin-bottom:14px}.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn.dng{background:var(--danger);border-color:var(--danger);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:9px;display:none;z-index:30}
.sk{height:14px;border-radius:6px;background:linear-gradient(90deg,#e8ecf1,#f4f6f9,#e8ecf1);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.state{text-align:center;padding:36px 10px;color:var(--mut)}.state b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.banner{background:#fdecea;border:1px solid #f5c2bd;color:var(--danger);padding:12px 14px;border-radius:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.seg{display:inline-flex;background:#e8ecf1;border-radius:9px;padding:3px;flex-wrap:wrap}.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--mut)}.seg button.on{background:#fff;color:var(--ink)}
.demo{display:flex;gap:8px;align-items:center;margin-bottom:12px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:12px 10px;margin:0}.kv dt{color:var(--mut)}.kv dd{margin:0;font-weight:600}
@media(max-width:600px){.kv{grid-template-columns:1fr}}
</style></head><body><div class="app"><nav class="side"><div class="brand"><span class="logo">₹</span>Expenses</div><a class="" href="dashboard.html">Dashboard</a><a class="" href="expenses.html">Expenses</a><a class="" href="analytics.html">Analytics</a><a class="" href="assistant.html">Assistant</a><a class="on" href="conversations.html">Chat history</a><div class="me">Asha Rao<br><a href="auth.html" style="padding:0;color:#93a3b8">Sign out</a></div></nav><main class="main">
<div class="top"><div><h1>Chat history</h1><p class="sub">Pick up an earlier conversation with the assistant</p></div><a class="btn pri" href="assistant.html">New chat</a></div>
<div class="card"><div class="tools"><input id="q" placeholder="Search conversations" aria-label="Search" style="flex:1;min-width:200px"></div><div id="list"></div><div id="empty" class="state" style="display:none"><b>No conversations found</b>Try a different search, or start a new chat.</div>
<div class="pager small"><span id="cnt"></span><span>Page 1 of 1</span></div></div></main></div><div class="toast" id="toast"></div><script>const $=id=>document.getElementById(id);const f=n=>"₹"+Number(n).toLocaleString("en-IN",{minimumFractionDigits:n%1?2:0});function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
const C=[["Dinner expense","Today, 1:46 pm","Deleted: ₹500 Dinner on 22 Nov.",8],["October vs November","Yesterday","Your spending is down 6.7% from October.",6],["Food spending","18 Nov","You spent ₹9,800 on food this month.",4],["Pharmacy bill","12 Nov","Recorded ₹300 for Pharmacy (Health).",2],["Weekend trip costs","3 Nov","Travel spending this month: ₹1,200.",10]];
function draw(){const q=$("q").value.toLowerCase(),r=C.filter(c=>c[0].toLowerCase().includes(q)||c[2].toLowerCase().includes(q));
 $("list").innerHTML=r.map(c=>`<a href="assistant.html" style="display:flex;justify-content:space-between;gap:14px;padding:14px 6px;border-bottom:1px solid var(--line);color:var(--ink)"><span><b>${c[0]}</b><br><span class="small">${c[2]}</span></span><span class="small" style="text-align:right;white-space:nowrap">${c[1]}<br>${c[3]} messages</span></a>`).join("");
 $("empty").style.display=r.length?"none":"block";$("cnt").textContent=r.length+" conversation"+(r.length===1?"":"s")}
$("q").oninput=draw;draw();</script></body></html>
